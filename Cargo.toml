[package]
name = "dev-events-bridge-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "MQTT event routing for dev-events bridges"

[dependencies]
anyhow = "1"
log = "0.4"
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "signal"] }

[dev-dependencies]
serde_yaml = "0.9"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
